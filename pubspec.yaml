name: pynp_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  firebase_storage: ^13.4.6
  firebase_analytics: ^12.4.6
  firebase_app_check: ^0.4.6
  firebase_crashlytics: ^5.0.0
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  http: ^1.6.0
  image_picker: ^1.0.7
  file_picker: ^12.0.0
  firebase_messaging: ^16.5.0
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.0
  build_runner: ^2.4.0
  # These are already pulled in transitively by firebase_auth/firebase_core,
  # but the test suite imports them directly to build fake platform
  # instances for widget tests without touching a real Firebase project.
  # `any` intentionally imposes no extra version constraint - it just
  # declares the dependency explicitly so pub doesn't warn about relying on
  # an undeclared transitive package.
  firebase_auth_platform_interface: any
  firebase_core_platform_interface: any

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/images/app_icon.png"